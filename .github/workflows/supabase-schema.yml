name: Supabase-Schema einspielen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [supabase/schema.sql]

permissions:
  contents: read

concurrency:
  group: supabase-schema
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schema anwenden
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository-Secret SUPABASE_DB_URL fehlt (siehe README)."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f supabase/schema.sql
          echo "Schema erfolgreich eingespielt."
